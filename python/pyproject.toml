[project]
name = "photo-upload"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "gunicorn>=22.0,<24",
    "redis>=5.0,<6",
    "pillow>=10.0,<12",
    "pillow-heif>=0.18,<1",
    "qrcode>=8.2",
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
detector = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.20,<2",
]

[tool.uv]
package = false
