name: Deploy

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/photo-upload
  IMAGE_NGINX: ghcr.io/${{ github.repository_owner }}/photo-upload-nginx
  IMAGE_DETECTOR: ghcr.io/${{ github.repository_owner }}/photo-upload-detector

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Auth GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "${DOCKER_CONFIG}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
          python3 - <<'PY'
          import base64, json, os
          auth = base64.b64encode(f"{os.environ['GHCR_USER']}:{os.environ['GHCR_TOKEN']}".encode()).decode()
          path = os.path.join(os.environ["DOCKER_CONFIG"], "config.json")
          with open(path, "w") as f:
              json.dump({"auths": {"ghcr.io": {"auth": auth}}}, f)
          PY

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-compose/Dockerfile
          target: app
          platforms: linux/arm64
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-compose/Dockerfile
          target: nginx
          platforms: linux/arm64
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NGINX }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-compose/Dockerfile
          target: detector
          platforms: linux/arm64
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_DETECTOR }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to /opt/app/photo-upload
        run: |
          dest=/opt/app/photo-upload
          mkdir -p "$dest"
          rsync -rlt --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            --exclude 'logs/' \
            --exclude 'secret.env' \
            --exclude 'docker-compose/secret.env' \
            "${GITHUB_WORKSPACE}/" "$dest/"

      - name: Auth GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "${DOCKER_CONFIG}"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"
          python3 - <<'PY'
          import base64, json, os
          auth = base64.b64encode(f"{os.environ['GHCR_USER']}:{os.environ['GHCR_TOKEN']}".encode()).decode()
          path = os.path.join(os.environ["DOCKER_CONFIG"], "config.json")
          with open(path, "w") as f:
              json.dump({"auths": {"ghcr.io": {"auth": auth}}}, f)
          PY

      - name: Start stack
        working-directory: /opt/app/photo-upload/docker-compose
        env:
          IMAGE_TAG: latest
        run: |
          if docker compose version >/dev/null 2>&1; then
            compose() { docker compose "$@"; }
          else
            compose() { docker-compose "$@"; }
          fi
          photo="${HOST_PHOTO_DIR:-/Volumes/OWC Envoy Pro FX/photo-upload}"
          mkdir -p "$photo/logs" "$photo/postgres"
          if [[ ! -f secret.env ]]; then
            echo "missing docker-compose/secret.env (not in git; copy secret.env.example)" >&2
            exit 1
          fi
          rm -rf /opt/app/photo-upload/logs
          ln -s "$photo/logs" /opt/app/photo-upload/logs
          compose pull
          compose up -d
