duration_seconds: 600
time_bonus_every: 20
max_players: 4
judge_threshold: 0.5
adventure:
  pick:
    high: 1
    mid: 1
    low: 2
demo:
  max_players: 1
  pick:
    high: 1
    mid: 1
    low: 2
  tasks:
    - id: couple
      type: couple
      points: 10
      prompt:
        zh: 請拍攝一張新郎與新娘的照片，並上傳
        en: Take a photo of the bride and groom, then upload it
high:
  - id: find_person
    type: person
    points: 25
    prompt:
      zh: 找到畫面中的人請求合照，請先徵得同意
      en: Find the person in this photo and take a group picture. Ask first.
mid:
  - id: wear_red
    type: color
    color: red
    points: 10
    prompt:
      zh: 與穿著紅色衣服的賓客合照
      en: Take a photo with a guest wearing red
  - id: wear_white
    type: color
    color: white
    points: 10
    prompt:
      zh: 與穿著白色衣服的賓客合照
      en: Take a photo with a guest wearing white
  - id: wear_black
    type: color
    color: black
    points: 10
    prompt:
      zh: 與穿著黑色衣服的賓客合照
      en: Take a photo with a guest wearing black
  - id: wear_blue
    type: color
    color: blue
    points: 10
    prompt:
      zh: 與穿著藍色衣服的賓客合照
      en: Take a photo with a guest wearing blue
low:
  - id: pushups
    type: host
    points: 5
    prompt:
      zh: 伏地挺身 x5
      en: 5 push-ups
  - id: jump_squats
    type: host
    points: 5
    prompt:
      zh: 交互蹲跳 x5
      en: 5 jump squats
  - id: lap
    type: host
    points: 5
    prompt:
      zh: 繞場一圈
      en: One lap of the venue
