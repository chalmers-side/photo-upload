# Event-day private server on this Mac (no OWC SSD).
# Data on the internal disk: HOST_PHOTO_DIR=/opt/app/photo-upload
# Use ./local.sh (up | doctor | backup | logs | restart | ps | down).
# Does not pull GHCR and does not change the production OWC compose.
name: photo-upload-local

x-build: &build
  context: ..
  dockerfile: docker-compose/Dockerfile

services:
  app:
    build:
      <<: *build
      target: app
    restart: unless-stopped
    env_file:
      - secret.env
    environment:
      PHOTO_DIR: /data/photos
      LOG_DIR: /logs
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://photo:photo@postgres:5432/photo
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"
    volumes:
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}:/data/photos
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}/logs:/logs
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  detector:
    build:
      <<: *build
      target: detector
    restart: unless-stopped
    environment:
      PHOTO_DIR: /data/photos
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://photo:photo@postgres:5432/photo
      DETECTOR_THREADS: "2"
    volumes:
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}:/data/photos:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  judge:
    build:
      <<: *build
      target: judge
    restart: unless-stopped
    environment:
      PHOTO_DIR: /data/photos
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://photo:photo@postgres:5432/photo
      JUDGE_THREADS: "2"
      JUDGE_MODEL_DIR: /app/models
    volumes:
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}:/data/photos:ro
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}/models:/app/models
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    build:
      <<: *build
      target: nginx
    restart: unless-stopped
    ports:
      - "${LOCAL_PORT:-8000}:80"
    volumes:
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}:/data/photos:ro
    depends_on:
      app:
        condition: service_started
        restart: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: photo
      POSTGRES_DB: photo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${HOST_PHOTO_DIR:-/opt/app/photo-upload}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 2s
      timeout: 5s
      retries: 20
