name: photo-upload

services:
  app:
    image: ghcr.io/chalmers-chang/photo-upload:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PHOTO_DIR: /data/photos
      LOG_DIR: /logs
      REDIS_URL: redis://redis:6379/0
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"
    volumes:
      - "${HOST_PHOTO_DIR:-/Volumes/OWC Envoy Pro FX/photo-upload}:/data/photos"
      - "${HOST_PHOTO_DIR:-/Volumes/OWC Envoy Pro FX/photo-upload}/logs:/logs"
    depends_on:
      - redis

  detector:
    image: ghcr.io/chalmers-chang/photo-upload-detector:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PHOTO_DIR: /data/photos
      REDIS_URL: redis://redis:6379/0
      DETECTOR_THREADS: "2"
    volumes:
      - "${HOST_PHOTO_DIR:-/Volumes/OWC Envoy Pro FX/photo-upload}:/data/photos:ro"
    depends_on:
      - redis

  nginx:
    image: ghcr.io/chalmers-chang/photo-upload-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - "${HOST_PHOTO_DIR:-/Volumes/OWC Envoy Pro FX/photo-upload}:/data/photos:ro"
    depends_on:
      app:
        condition: service_started
        restart: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  redis-data:
