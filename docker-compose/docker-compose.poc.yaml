# Local POC stack (this Mac). Builds from source; does not touch GHCR or the OWC volume.
# Use ./poc.sh (up | seed | logs | restart | ps | down | reset).
name: photo-upload-poc

x-build: &build
  context: ..
  dockerfile: docker-compose/Dockerfile

services:
  app:
    build:
      <<: *build
      target: app
    environment:
      PHOTO_DIR: /data/photos
      LOG_DIR: /logs
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://photo:photo@postgres:5432/photo
    command:
      - sh
      - -c
      - >-
        exec gunicorn web.wsgi:app --bind 0.0.0.0:8000 --workers 2 --timeout 120 --reload
        $$(find web/templates -type f -printf ' --reload-extra-file %p')
    volumes:
      - ../web:/app/web
      - ../config:/app/config
      - ./poc_seed.py:/app/poc_seed.py:ro
      - ${POC_DATA_DIR:-../.poc}/photos:/data/photos
      - ${POC_DATA_DIR:-../.poc}/photos/logs:/logs
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  detector:
    build:
      <<: *build
      target: detector
    environment:
      PHOTO_DIR: /data/photos
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://photo:photo@postgres:5432/photo
      DETECTOR_THREADS: "2"
    volumes:
      - ../web:/app/web:ro
      - ../config:/app/config:ro
      - ${POC_DATA_DIR:-../.poc}/photos:/data/photos:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    build:
      <<: *build
      target: nginx
    ports:
      - "${POC_PORT:-8001}:80"
    volumes:
      - ${POC_DATA_DIR:-../.poc}/photos:/data/photos:ro
    depends_on:
      app:
        condition: service_started
        restart: true

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: photo
      POSTGRES_DB: photo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POC_DATA_DIR:-../.poc}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 2s
      timeout: 5s
      retries: 20
